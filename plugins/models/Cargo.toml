[package]
name = "frust-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Model store and downloader for on-device AI models in Frust apps"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["hub"]
hub = ["dep:ureq", "dep:sha2", "dep:rustls", "dep:webpki-roots"]

[dependencies]
frust-paths = { path = "../../crates/frust-paths", version = "0.6.6" }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

# Backup exclusion on iOS and macOS goes through `NSURL` resource values.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSError",
    "NSURL",
    "NSValue",
    "NSObject",
] }
